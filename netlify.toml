[build]
command = "npm run monitor:check && npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "22"

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"

[dev]
framework = "#static"
publish = "dist"

[[headers]]
for = "/monitoring/*"
[headers.values]
X-Robots-Tag = "noindex, nofollow"
Cache-Control = "no-store"
