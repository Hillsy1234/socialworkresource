<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Ultimate Social Worker Resource logo</title>
  <desc id="logoDesc">A rounded learning mark with a path, open pages, and a warm centre point.</desc>
  <defs>
    <linearGradient id="markGradient" x1="12" y1="12" x2="84" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#287c8f"/>
      <stop offset="0.48" stop-color="#4f8a66"/>
      <stop offset="1" stop-color="#c5902d"/>
    </linearGradient>
    <linearGradient id="pageGradient" x1="27" y1="29" x2="72" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#e6f4f8"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#1f3234" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="96" height="96" rx="24" fill="#fffdf8"/>
  <rect x="7" y="7" width="82" height="82" rx="20" fill="url(#markGradient)" filter="url(#softShadow)"/>
