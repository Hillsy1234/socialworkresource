  <path d="M48 36v34" fill="none" stroke="#287c8f" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M30 43c6-2.8 11-1.9 15 2.6M30 53c6-2.4 11-1.5 15 2.4M66 43c-6-2.8-11-1.9-15 2.6M66 53c-6-2.4-11-1.5-15 2.4" fill="none" stroke="#4f8a66" stroke-width="3" stroke-linecap="round"/>
  <path d="M48 27c-7 6-10 12-10 18 0 9 7 15 10 18 3-3 10-9 10-18 0-6-3-12-10-18Z" fill="#cf7258"/>
  <circle cx="48" cy="44" r="5.8" fill="#ffd179"/>
  <path d="M25 72c11-6 22-4 23 5 1-9 12-11 23-5" fill="none" stroke="#fffdf8" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
